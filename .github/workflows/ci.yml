name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Ebitengine desktop builds are pure Go; keep cgo off so CI matches the Windows build.
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt, vet, test
        run: go tool mage check
      - name: race detector (server, protocol, rules)
        run: go test -race ./server/... ./proto/ ./core/
        env:
          CGO_ENABLED: "1"
      - name: build desktop (windows, macOS, linux)
        run: go tool mage desktop mac linux
      # Builds the web game and the server inside Docker for amd64 and arm64; the image is not pushed. A
      # docker-container builder builds both platforms whatever image store the runner's Docker uses.
      - name: build image (web + server, amd64 + arm64)
        run: |
          docker buildx create --use
          go tool mage image

  # The runner comes with the Android SDK, an NDK and JDK 17; Gradle fetches the platform it lacks. No release key
  # here, so the APK is debug-signed and not kept: published APKs are built locally with the key.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build android
        run: go tool mage android
