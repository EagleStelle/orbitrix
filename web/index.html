<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F4F3F0">
<title>Orbitrix</title>
<style>
  /* Only the loader lives here; the game draws everything else itself, in the canvas Ebitengine adds. */
  :root { --mat: #F4F3F0; --tile: #E0DED9; --ink: #171615; }
  :root.dark { --mat: #1C1A18; --tile: #2D2A27; --ink: #F5F2EE; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--mat); }
  #load { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; }
  #dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; max-width: 336px; }
  #dots i { width: 16px; height: 16px; border-radius: 50%; background: var(--tile); transition: background-color .25s; }
  #load p { margin: 0; max-width: 32ch; text-align: center; color: var(--ink); font: 500 18px/1.3 system-ui, sans-serif; }
</style>
<div id="load"><div id="dots"></div></div>
<script src="wasm_exec.js"></script>
<script>
  // The twelve seat dots fill with their players' inks as game.wasm arrives.
  const wasmSize = /*WASM_SIZE*/0; // bytes; cmd/webdist writes it in, since a compressed download hides the real size
  const inks = {
    light: ["#D55E00", "#0072B2", "#009E73", "#E69F00", "#CC79A7", "#56B4E9", "#E8D21D", "#2E2C2A", "#7B4FD6", "#8B5A2B", "#9BCB00", "#E8418C"],
    dark: ["#E86A1A", "#3A9BE0", "#1FB88C", "#F0AA1A", "#DD8DB8", "#7CC6F0", "#F0E442", "#F4F4F4", "#9C7BF0", "#C98B4E", "#B4E61E", "#FF5FA8"],
  };
  let theme = "light";
  try {
    theme = JSON.parse(localStorage.getItem("orbitrix/settings.json")).theme === "dark" ? "dark" : "light";
  } catch {}
  if (theme === "dark") {
    document.documentElement.classList.add("dark");
    document.querySelector('meta[name="theme-color"]').content = "#1C1A18";
  }
  const dots = inks[theme].map(() => document.getElementById("dots").appendChild(document.createElement("i")));
  const light = (f) => dots.forEach((d, i) => { if (f * dots.length >= i + 1) d.style.backgroundColor = inks[theme][i]; });

  (async () => {
    try {
      const res = await fetch("game.wasm");
      if (!res.ok) throw new Error("game.wasm: HTTP " + res.status);
      const total = wasmSize || Number(res.headers.get("Content-Length")) || 0;
      const reader = res.body.getReader();
      let got = 0;
      const counted = new Response(new ReadableStream({
        async pull(c) {
          const { done, value } = await reader.read();
          if (done) { light(1); c.close(); return; }
          got += value.length;
          if (total) light(got / total);
          c.enqueue(value);
        },
      }), { headers: { "Content-Type": "application/wasm" } });
      const go = new Go();
      const { instance } = await WebAssembly.instantiateStreaming(counted, go.importObject);
      document.getElementById("load").remove();
      go.run(instance);
    } catch (e) {
      console.error(e);
      document.getElementById("load").innerHTML = "<p>Orbitrix didn't load. Reload the page to try again.</p>";
    }
  })();
</script>
</html>
