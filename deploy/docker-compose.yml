# The website and signaling server, from the orbitrix-server image the build scripts' image target makes. Values come
# from deploy/.env (start from .env.example). The port is published on 127.0.0.1 only: put your own reverse proxy in
# front of it to make it public.
#
#   docker compose up -d                                          # on the server
#   docker compose -f docker-compose.yml -f compose.dev.yml up    # locally, at http://localhost:1212
name: orbitrix

services:
  orbitrix:
    image: orbitrix-server
    restart: unless-stopped
    ports: ["127.0.0.1:1212:1212"]
    environment:
      LISTEN: ":1212"
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      HOST_PASSWORD: ${HOST_PASSWORD:-}
      CF_TURN_KEY_ID: ${CF_TURN_KEY_ID:-}
      CF_TURN_API_TOKEN: ${CF_TURN_API_TOKEN:-}
    volumes:
      - ./downloads:/downloads:ro # orbitrix.exe and orbitrix.apk, once published
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
